<section id="education" class="section" aria-labelledby="education-title">
  <div class="section-heading"><p class="section-number">04 / EDUCATION</p><h2 id="education-title">A foundation in information technology and computer science.</h2></div>
  <div class="education-list">
    @for (item of education; track item.degree) {
      <article class="education-item"><p class="period">{{ item.period }}</p><div><h3>{{ item.degree }}</h3><p>{{ item.institution }} <span>·</span> {{ item.location }}</p></div></article>
    }
  </div>
  <footer class="page-footer"><span>NS / 2026</span><span>Available for professional opportunities</span><a href="#summary">Back to top ↑</a></footer>
</section>
